name: Test

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Solana CLI (Agave v2.1.0)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Install Anchor CLI 0.31.1
        run: |
          sudo curl -sSfL -o /usr/local/bin/anchor https://github.com/coral-xyz/anchor/releases/download/v0.31.1/anchor-0.31.1-x86_64-unknown-linux-gnu
          sudo chmod +x /usr/local/bin/anchor
          anchor --version
      - name: Install dependencies
        run: npm ci
      - name: Run task 02 tests
        run: |
          mkdir -p "$HOME/.cache/solana"
          anchor build -p oracle_vault -- -v
          npx ts-mocha -p ./tsconfig.json -t 1000000 tests/02-find-the-root-of-trust/*.test.ts
      - name: Run task 03 tests
        run: |
          anchor build -p operator_free -- -v
          npx ts-mocha -p ./tsconfig.json -t 1000000 tests/03-run-it-without-the-operator/*.test.ts
      - name: Run task 04 tests
        run: |
          anchor build -p lazy_pool -- -v
          npx ts-mocha -p ./tsconfig.json -t 1000000 tests/04-rewards-without-a-loop/*.test.ts
      - name: Run task 05 tests
        run: |
          anchor build -p local_book -- -v
          npx ts-mocha -p ./tsconfig.json -t 1000000 tests/05-orderbook-with-local-checks/*.test.ts
      - name: Run task 06 tests
        run: |
          anchor build -p open_multisig -- -v
          npx ts-mocha -p ./tsconfig.json -t 1000000 tests/06-proposal-anyone-can-execute/*.test.ts
      - name: Run task 07 tests
        run: |
          anchor build -p total_claims -- -v
          npx ts-mocha -p ./tsconfig.json -t 1000000 tests/07-claims-in-any-order/*.test.ts
      - name: Run task 08 tests
        run: |
          anchor build -p position_value -- -v
          npx ts-mocha -p ./tsconfig.json -t 1000000 tests/08-value-the-position/*.test.ts
      - name: Run task 09 tests
        run: |
          anchor build -p round_exit -- -v
          npx ts-mocha -p ./tsconfig.json -t 1000000 tests/09-write-the-exit/*.test.ts
